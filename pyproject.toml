[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eesd-thesis"
version = "0.1.0"
description = "Batched early-exit self-speculative decoding (master's thesis research code)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "safetensors>=0.4",
    "datasets>=2.16",
    "huggingface_hub>=0.23",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["common*", "solutions*", "evaluation*", "observation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: needs a real checkpoint in ./models (run with: pytest -m slow)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
